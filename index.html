<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Event Registration Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Student Event Registration Analyzer</h1>

    <form id="eventForm">

        <label>Student Name</label>
        <input type="text" id="name" placeholder="Enter Name">

        <label>Roll Number</label>
        <input type="text" id="roll" placeholder="Enter Roll Number">

        <label>Event Name</label>
        <input type="text" id="event" placeholder="Enter Event Name">

        <label>Age</label>
        <input type="number" id="age" placeholder="Enter Age">

        <label>Number of Events Attended</label>
        <input type="number" id="events" placeholder="Enter Number">

        <button type="button" onclick="analyze()">Analyze</button>

    </form>

    <h2 id="result"></h2>

    <h2>Preferred Technical Events</h2>

    <ul id="eventList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
